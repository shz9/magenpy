name: Continuous benchmark

on:
  push:
    paths-ignore:
      - benchmarks/results.csv
      - benchmarks/results.md
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional baseline Git ref (defaults to the preceding commit).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: continuous-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  benchmark:
    name: Native speed and memory regression check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-benchmark.txt
            requirements.txt
            pyproject.toml
      - name: Select baseline revision
        id: baseline
        env:
          BASELINE_REF: ${{ inputs.baseline_ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          EXPLICIT_BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          options=()
          if [ -z "$EXPLICIT_BASELINE_REF" ]; then
            options+=(--allow-fallback)
          fi
          baseline_sha=$(python benchmarks/resolve_baseline.py "$BASELINE_REF" "${options[@]}")
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout baseline separately
        if: steps.baseline.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          persist-credentials: false
      - name: Install shared runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libopenblas-dev
          python -m pip install -r requirements-benchmark.txt
          mkdir -p "$RUNNER_TEMP/benchmark"
          python -m pip freeze > "$RUNNER_TEMP/benchmark/dependencies.txt"
      - name: Build current native extensions
        run: python -m pip install --verbose --no-deps --no-build-isolation --editable .
      - name: Benchmark current revision
        env:
          BENCHMARK_REVISION: ${{ github.sha }}
          BENCHMARK_PUSH_DATE: ${{ github.event_name == 'push' && github.event.repository.pushed_at || '' }}
        run: |
          python benchmarks/benchmark_native.py \
            --source-root "$GITHUB_WORKSPACE" \
            --bfile "$GITHUB_WORKSPACE/magenpy/data/1000G_eur_chr22" \
            --revision "$BENCHMARK_REVISION" \
            --threads 1 2 --repeats 5 --require-openmp \
            --output "$RUNNER_TEMP/benchmark/current.json"
      - name: Build baseline in the same Python environment
        if: steps.baseline.outputs.sha != ''
        run: python -m pip install --verbose --no-deps --no-build-isolation --editable ./baseline
      - name: Benchmark baseline on the same runner
        if: steps.baseline.outputs.sha != ''
        env:
          BENCHMARK_REVISION: ${{ steps.baseline.outputs.sha }}
        run: |
          python benchmarks/benchmark_native.py \
            --source-root "$GITHUB_WORKSPACE/baseline" \
            --bfile "$GITHUB_WORKSPACE/magenpy/data/1000G_eur_chr22" \
            --revision "$BENCHMARK_REVISION" \
            --threads 1 2 --repeats 5 --require-openmp --allow-unsupported \
            --output "$RUNNER_TEMP/benchmark/baseline.json"
      - name: Compare runtime and memory; merge history
        id: compare
        continue-on-error: true
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          baseline_args=()
          if [ -n "$BASELINE_SHA" ]; then
            baseline_args+=(--baseline "$RUNNER_TEMP/benchmark/baseline.json")
          fi
          python benchmarks/benchmark_report.py \
            --current "$RUNNER_TEMP/benchmark/current.json" \
            "${baseline_args[@]}" \
            --history benchmarks/results.csv \
            --output-dir "$RUNNER_TEMP/benchmark"
      - name: Add benchmark table to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/benchmark/results.md" ]; then
            cat "$RUNNER_TEMP/benchmark/results.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw timings, metadata, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-benchmark-results
          path: ${{ runner.temp }}/benchmark
          if-no-files-found: ignore
          retention-days: 90
      - name: Fail on a regression or invalid comparison
        if: steps.compare.outcome == 'failure'
        run: exit 1

  publish:
    name: Publish benchmark history
    needs: benchmark
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: continuous-benchmark-results
          path: ${{ runner.temp }}/benchmark
      - name: Merge with latest history and publish
        env:
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: |
          baseline_args=()
          if [ -f "$RUNNER_TEMP/benchmark/baseline.json" ]; then
            baseline_args+=(--baseline "$RUNNER_TEMP/benchmark/baseline.json")
          fi
          python benchmarks/benchmark_report.py \
            --current "$RUNNER_TEMP/benchmark/current.json" \
            "${baseline_args[@]}" \
            --history benchmarks/results.csv \
            --output-dir "$RUNNER_TEMP/published"
          cp "$RUNNER_TEMP/published/results.csv" benchmarks/results.csv
          cp "$RUNNER_TEMP/published/results.md" benchmarks/results.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results.csv benchmarks/results.md
          if ! git diff --cached --quiet; then
            git commit -m "Update benchmarks for ${BENCHMARK_COMMIT:0:7} [skip ci]"
            git push
          fi
