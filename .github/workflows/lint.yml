name: Format and lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    name: Apply automatic fixes
    if: >-
      github.ref_type == 'branch' && github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install lint tools
        run: python -m pip install -r requirements-lint.txt

      - name: Apply safe fixes and formatting
        run: make fix

      - name: Commit fixes to the source branch
        id: commit
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add --update
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply automatic lint fixes and formatting"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  lint:
    needs: fix
    if: >-
      always() && !cancelled() &&
      (needs.fix.result == 'success' || needs.fix.result == 'skipped')
    name: Lint (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Python
            target: lint-python
          - language: Cython
            target: lint-cython
          - language: C/C++
            target: lint-cpp
    env:
      RUFF_OUTPUT_FORMAT: github
    steps:
      - name: Checkout formatted code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fix.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install lint tools
        run: python -m pip install -r requirements-lint.txt

      - name: Run linter
        run: make ${{ matrix.target }}
