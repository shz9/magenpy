name: Build WASM

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (blank builds the selected ref)
        type: string
        default: ""
      publish:
        description: Attach the tested wheel to that existing release (requires release_tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: magenpy-wasm-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: magenpy-wasm-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PYODIDE_XBUILDENV_PATH: ${{ github.workspace }}/build/wasm/xbuildenv
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      SOURCE_DIR: ${{ inputs.release_tag != '' && format('{0}/build/wasm/release-source', github.workspace) || github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Lets the workflow backfill WASM for tags that predate these build helpers.
      - uses: actions/checkout@v4
        if: inputs.release_tag != ''
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: build/wasm/release-source
          persist-credentials: false

      - name: Validate manual publishing request
        if: inputs.publish && inputs.release_tag == ''
        run: |
          echo '::error::Set release_tag to an existing release when publish is enabled.'
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/wasm/requirements-build.txt

      - name: Install build and test tools
        run: python -m pip install -r tools/wasm/requirements-build.txt playwright

      - uses: actions/cache@v4
        with:
          path: build/wasm/emsdk
          key: wasm-emsdk-${{ runner.os }}-${{ runner.arch }}-4.0.9-v1

      - name: Install matching Pyodide and Emscripten toolchains
        run: |
          pyodide xbuildenv install 0.28.3
          if [ ! -d build/wasm/emsdk ]; then
            git clone --depth 1 --branch 4.0.9 https://github.com/emscripten-core/emsdk.git build/wasm/emsdk
          fi
          build/wasm/emsdk/emsdk install 4.0.9
          build/wasm/emsdk/emsdk activate 4.0.9

      - name: Build magenpy WASM and checksum metadata
        shell: bash
        run: |
          source build/wasm/emsdk/emsdk_env.sh
          python tools/wasm/build.py --source "$SOURCE_DIR" --release-tag "$RELEASE_TAG"

      - name: Test real WASM imports and LD operations in Chromium
        run: |
          python -m playwright install --with-deps chromium
          python tools/wasm/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: magenpy-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/wasm/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release-assets:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist/wasm

      - name: Preserve assets attached before an immutable release was published
        if: github.event.release.immutable == true
        working-directory: dist/wasm
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          release = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["release"]
          wheel = json.loads(Path("magenpy-wasm.json").read_text())["wheel"]
          required = {wheel, wheel + ".sha256", "magenpy-wasm.json"}
          if not required.issubset({a["name"] for a in release["assets"]}):
              raise SystemExit("Immutable release: attach the tested WASM assets to the draft before publishing.")
          print("WASM assets already attached; preserving immutable release.")
          PYTHON

      - name: Attach the tested wheel to the existing release
        if: github.event.release.immutable != true
        working-directory: dist/wasm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          sha256sum --check ./*.whl.sha256
          gh release upload "$RELEASE_TAG" ./*.whl ./*.whl.sha256 magenpy-wasm.json --clobber
